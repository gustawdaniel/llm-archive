services:
  llm-archive-web:
    # Built in CI (see .github/workflows/llm-archive-web.yml), pushed to ghcr.io.
    # No `build:` stanza on purpose: this host only ever pulls this tag via
    # deploy-dispatch.sh, it never builds from whatever happens to be on its
    # disk (that's what silently served stale UI before).
    image: ghcr.io/gustawdaniel/brain-llm-archive-web:latest
    container_name: brain-llm-web
    restart: on-failure:5
    network_mode: "host"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOST=0.0.0.0
      - LLM_API_URL=http://127.0.0.1:8080
